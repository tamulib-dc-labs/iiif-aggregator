name: Build IIIF Collections

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Switch to iiif branch
        run: |
          # Create branch if it does not exist
          if git show-ref --quiet refs/heads/iiif; then
            git checkout iiif
          else
            git checkout -b iiif
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml iiif-prezi3

      - name: Build IIIF Collections
        run: python iiif_aggregator/aggregate.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add collections/*.json
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Automated update of IIIF collections"
            git push
          else
            echo "No changes to commit"
          fi

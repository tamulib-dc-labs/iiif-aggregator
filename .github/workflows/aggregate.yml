name: Build IIIF Collections

on:
  push:
    branches:
      - main

# Prevent concurrent runs from causing conflicts
concurrency:
  group: iiif-collections
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      # Step 1: checkout the iiif branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: iiif
          persist-credentials: true
          fetch-depth: 0

      # Step 2: set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # Step 3: install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml iiif-prezi3

      # Step 4: run the aggregator
      - name: Build IIIF Collections
        run: python iiif_aggregator/aggregate.py

      # Step 5: commit and push changes to iiif branch
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update of IIIF collections"
          file_pattern: "collections/*.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          branch: iiif

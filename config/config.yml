  batallion:
    name: The Battalion
    summary: |
      The Battalion started production in 1893 as a monthly publication by the Stephen F. Austin and Calliopean Literary Societies until 1906 when publication was taken over by the Student Association. The Battalion is the longest running student newspaper at Texas A&M, having been continuously published since 1893 with the exception for a short period in 1918 during World War I.
    curator: Krista Oldham
    groups:
      - ua
      - all
    iiif_collection: "https://newspaper.library.tamu.edu/lccn/sn86088544.json"
    platform:
      name: OpenOni
      url: "https://newspaper.library.tamu.edu/lccn/sn86088544"
      file_location: OpenOni
    notes:
      - ""
    thumbnail: "https://newspaper.library.tamu.edu/images/iiif/batch_txa_batt_ver06%2Fdata%2Fsn86088544%2Fprint%2F1893100101%2F0001.jp2/full/360,/0/default.jpg"
  berger:
    name: Berger-Cloonan Collection of Decorated Papers
    summary: |
      The Berger-Cloonan Collection of Decorated Papers contains more than 20,000 items representing five centuries of paper production and decoration from across the globe and is one of the most extensive collections of its kind. Among its many strengths are eighteenth-century Dutch gilt papers, thousands of unique marbled and paste papers, Japanese Chiyogami and Katazome, historic watermarks, and scores of papermakers’ sample books.
      The collection was built by Dr. Sidney E. Berger and Dr. Michèle V. Cloonan in support of their research and teaching interests, and was acquired by Texas A&M University Libraries in 2016. This digital collection contains non-copyrighted papers in the Berger-Cloonan Collection. It is offered here as a starting point for students and researchers who wish to become acquainted with the collection. Digitization of the collection is ongoing, and high-resolution scans of papers will be uploaded as they become available.
    curator: Maddie Keyser
    metadata:
      - subjects:
          - Marbled papers
          - Endpapers
          - Decorated papers
    groups:
      - book-arts
      - all
    iiif_collection: "https://api.library.tamu.edu/iiif-service/fedora/collection/3b/6f/c3/25/3b6fc325-f6ca-41d8-b91e-8c5db3be8c13/berger_cloonan"

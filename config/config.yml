  dwg:
    name: "Dallas Women's Gallery Oral Histories"
    summary: This collection features video oral histories that recount the story of the Dallas Women’s Gallery, an artist-run space founded in 1975 that opened new doors for women and emerging artists in Texas. The interviews illuminate the creativity, resilience, and impact of a landmark yet often overlooked chapter in the state’s art history.

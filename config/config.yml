  bryan-150:
    name: "150 Years and Counting: Celebrating 150 Years of the City of Bryan, Texas"
    summary: "On November 29, 1871 the City of Bryan officially incorporated. Shortly after incorporation, a public school system was established, a bridge was built across the Navasota River to support local commerce, and a money-lending office was opened. In 2021, Cushing Memorial Library & Archives celebrates the 150th anniversary of the City of Bryan's incorporation through materials we've collected through the years. This digital exhibit highlights the architecture and growth of the city, from a rural settlement to a flourishing city and seat of Brazos County."
    curator: "?"
    groups:
      - texas
      - all
    iiif_collection: "https://api.library.tamu.edu/iiif-service/fedora/collection/3b/6f/c3/25/3b6fc325-f6ca-41d8-b91e-8c5db3be8c13/bryan-150"

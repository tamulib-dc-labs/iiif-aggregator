  live-to-build:
    name: "Live To Build A Better World: Despair, Survival, and Hope in Science Fiction’s Response to Environmental Change"
    summary: "Live To Build A Better World: Despair, Survival, and Hope in Science Fiction’s Response to Environmental Change was an exhibit that took place in Cushing Library’s 2nd-floor Wendler Gallery from January 19 – June 30, 2021. It was dedicated to exploring many of the narratives that science fiction has created to help people understand and grapple with the existential threat of human-caused climate change."
